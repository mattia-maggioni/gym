<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#17181A;
    --panel:#1F2124;
    --panel-2:#26292D;
    --line:#33373C;
    --text:#E9E6DF;
    --muted:#8C9099;
    --dim:#5F646B;
    --orange:#E2571C;
    --orange-dim:#8A3610;
    --moss:#8C9B45;
    --ochre:#C99A3C;
    --red:#C4483C;
    --display:'Oswald',Impact,'Haettenschweiler','Arial Narrow',sans-serif;
    --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select,summary,.chip,.tick,.flag,.prev{touch-action:manipulation}
  input,textarea{font-size:16px}
  body{
    margin:0;background:var(--ink);color:var(--text);
    font-family:var(--body);font-size:15px;line-height:1.5;
    padding-bottom:40px;
  }
  #app{max-width:820px;margin:0 auto;padding:0 14px}

  /* ---------- header ---------- */
  .masthead{
    display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
    padding:18px 0 12px;border-bottom:2px solid var(--line);
  }
  .wordmark{font-family:var(--display);font-weight:600;font-size:24px;
    letter-spacing:.11em;text-transform:uppercase;line-height:1}
  .wordmark span{color:var(--orange)}
  .subline{font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--dim);margin-top:5px}

  .weekbox{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .weekbox button{
    width:30px;height:30px;border:1px solid var(--line);background:var(--panel);
    color:var(--text);font-size:17px;line-height:1;cursor:pointer;border-radius:2px;
    font-family:var(--mono);
  }
  .weekbox button:hover{border-color:var(--orange);color:var(--orange)}
  .weeknum{text-align:center;min-width:64px}
  .weeknum b{font-family:var(--display);font-size:24px;font-weight:500;display:block;line-height:1}
  .weeknum i{font-family:var(--mono);font-size:9px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--dim);font-style:normal}

  /* ---------- nav ---------- */
  nav{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:16px;
    overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{
    background:none;border:none;border-bottom:2px solid transparent;
    color:var(--muted);font-family:var(--display);font-weight:400;font-size:13px;
    letter-spacing:.14em;text-transform:uppercase;padding:12px 14px;cursor:pointer;
    white-space:nowrap;margin-bottom:-1px;
  }
  nav button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--orange)}
  nav button:hover{color:var(--text)}

  /* ---------- day chips ---------- */
  .days{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;
    padding-bottom:2px}
  .days::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:2px;
    padding:7px 12px;cursor:pointer;text-align:left;min-width:78px;
  }
  .chip .d{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim);
    text-transform:uppercase}
  .chip .t{font-family:var(--display);font-size:14px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);margin-top:2px}
  .chip[aria-selected="true"]{border-color:var(--orange);background:var(--panel-2)}
  .chip[aria-selected="true"] .t{color:var(--text)}
  .chip[aria-selected="true"] .d{color:var(--orange)}
  .chip.rest{opacity:.45}
  .chip .dot{width:5px;height:5px;border-radius:50%;background:var(--moss);
    display:inline-block;margin-left:5px;vertical-align:middle}

  /* ---------- session head ---------- */
  .sesshead{display:flex;align-items:flex-start;justify-content:space-between;
    gap:14px;margin-bottom:4px}
  h1{font-family:var(--display);font-weight:500;font-size:30px;letter-spacing:.06em;
    text-transform:uppercase;margin:0;line-height:1.05}
  .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);margin-top:6px}
  .gauge{flex:0 0 auto;text-align:right}
  .gauge b{font-family:var(--display);font-size:28px;font-weight:500;line-height:1;
    color:var(--orange)}
  .gauge b.full{color:var(--moss)}
  .gauge i{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
    color:var(--dim);font-style:normal;text-transform:uppercase;margin-top:3px}

  .bar{height:3px;background:var(--panel-2);margin:12px 0 18px;position:relative;
    overflow:hidden;border-radius:2px}
  .bar i{position:absolute;inset:0 auto 0 0;background:var(--orange);
    transition:width .25s ease}
  .bar i.full{background:var(--moss)}

  /* ---------- exercise rows ---------- */
  .rows{border-top:1px solid var(--line)}
  .row{border-bottom:1px solid var(--line);padding:11px 0;display:grid;
    grid-template-columns:22px 1fr auto;gap:10px;align-items:start}
  .row.done .name{color:var(--muted)}
  .row.done .name b{text-decoration:line-through;text-decoration-color:var(--dim)}
  .idx{font-family:var(--mono);font-size:11px;color:var(--dim);padding-top:3px}
  .row.warm .idx{color:var(--ochre)}
  .name b{font-weight:600;font-size:15px;display:block;letter-spacing:-.005em}
  .name .presc{font-family:var(--mono);font-size:12px;color:var(--orange);margin-top:3px;
    letter-spacing:.02em}
  .name .hint{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}
  .name .hint.warnline{color:var(--ochre)}
  .rest{font-family:var(--mono);font-size:11px;color:var(--dim);padding-top:4px;
    white-space:nowrap}

  .ctrl{grid-column:2/4;margin-top:10px}
  .sets{display:flex;flex-direction:column;gap:5px;max-width:330px}
  .setrow{display:grid;grid-template-columns:20px 1fr 1fr 34px;gap:6px;align-items:center}
  .setrow .no{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center}
  .setrow.head .no,.setrow.head label{font-family:var(--mono);font-size:8.5px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:center}
  .setrow.head label{display:block}
  .setrow.head{margin-bottom:-1px}
  input.load{
    width:100%;background:var(--panel);border:1px solid var(--line);border-radius:2px;
    color:var(--text);font-family:var(--mono);font-size:16px;padding:6px 7px;text-align:center;
    touch-action:manipulation;
  }
  input.load::placeholder{color:var(--dim)}
  input.load:focus{outline:none;border-color:var(--orange)}
  .tick{
    width:34px;height:32px;border:1px solid var(--line);background:transparent;
    border-radius:2px;cursor:pointer;position:relative;padding:0;
  }
  .tick::after{content:"";position:absolute;inset:7px;background:transparent;border-radius:1px}
  .tick[aria-pressed="true"]{border-color:var(--orange)}
  .tick[aria-pressed="true"]::after{background:var(--orange)}
  .tick:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  .prev{
    background:none;border:1px dashed var(--line);border-radius:2px;cursor:pointer;
    padding:6px 9px;text-align:left;color:var(--muted);font-family:var(--mono);font-size:11px;
    margin-top:7px;max-width:330px;width:100%;line-height:1.4;
  }
  .prev span{display:block;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);margin-bottom:2px}
  .prev:hover{border-color:var(--orange);color:var(--text)}

  .closerow{margin:22px 0 6px;text-align:center}
  #closebtn{
    width:100%;padding:15px;background:var(--panel);border:1px solid var(--line);
    border-radius:2px;color:var(--dim);font-family:var(--display);font-size:14px;
    letter-spacing:.16em;text-transform:uppercase;font-weight:500;cursor:pointer;
  }
  #closebtn.ready{background:var(--orange);border-color:var(--orange);color:#170A03}
  #closebtn:disabled{cursor:default;opacity:.5}
  .closehint{font-size:12px;color:var(--dim);margin-top:9px;line-height:1.45}

  .dbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .dbtn{
    background:var(--panel-2);border:1px solid var(--line);border-radius:2px;color:var(--text);
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:9px 13px;cursor:pointer;display:inline-block;
  }
  .dbtn:hover{border-color:var(--orange);color:var(--orange)}
  .dbtn.go{background:var(--orange);border-color:var(--orange);color:#170A03}
  .impmsg{font-family:var(--mono);font-size:11.5px;margin-top:8px;min-height:16px}
  .impmsg.ok{color:var(--moss)}
  .impmsg.err{color:var(--red)}

  .track{border-bottom:1px solid var(--line);padding:13px 0}
  .track b{font-weight:600;font-size:14.5px;display:block;margin-bottom:8px}
  .spark{display:flex;flex-direction:column;gap:4px}
  .spark i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:5px 8px}
  .spark i:last-child{border-color:var(--orange);color:var(--text)}
  .spark i u{text-decoration:none;color:var(--dim);font-size:8.5px;letter-spacing:.1em;
    text-transform:uppercase;margin-right:5px}

  /* ---------- blocks / callouts ---------- */
  .block{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--orange);
    padding:12px 14px;margin:16px 0;border-radius:2px}
  .block.warn{border-left-color:var(--ochre)}
  .block.calm{border-left-color:var(--moss)}
  .block h4{font-family:var(--display);font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;margin:0 0 7px;font-weight:500;color:var(--muted)}
  .block p{margin:0 0 7px;font-size:13.5px;color:var(--text);line-height:1.5}
  .block p:last-child{margin-bottom:0}
  .block ul{margin:0;padding-left:17px;font-size:13.5px}
  .block li{margin-bottom:5px}
  .block li:last-child{margin-bottom:0}

  .after{margin:18px 0 0;padding:12px 14px;background:var(--panel);border:1px dashed var(--line);
    border-radius:2px;font-size:13.5px;color:var(--muted)}
  .after b{color:var(--text);font-family:var(--display);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;display:block;margin-bottom:6px;font-weight:500}

  /* ---------- pain ---------- */
  .pain{margin-top:20px;background:var(--panel);border:1px solid var(--line);
    padding:14px;border-radius:2px}
  .pain h4{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    margin:0 0 4px;font-weight:500}
  .pain .q{font-size:12.5px;color:var(--muted);margin:10px 0 7px}
  .scale{display:flex;gap:3px}
  .scale button{
    flex:1;min-width:0;height:32px;background:var(--panel-2);border:1px solid var(--line);
    color:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer;border-radius:2px;
  }
  .scale button[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:#15170D}
  .scale button.hi[aria-pressed="true"]{background:var(--ochre);border-color:var(--ochre);color:#1A1408}
  .scale button.max[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
  .flags{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .flag{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    font-size:12px;padding:6px 11px;border-radius:2px;cursor:pointer;font-family:var(--body)}
  .flag[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
  textarea.note{width:100%;margin-top:11px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:2px;color:var(--text);font-family:var(--body);font-size:16px;padding:9px;
    min-height:58px;resize:vertical}
  textarea.note:focus{outline:none;border-color:var(--orange)}

  /* ---------- diary ---------- */
  .entry{border-bottom:1px solid var(--line);padding:12px 0;display:flex;
    justify-content:space-between;gap:12px;align-items:flex-start}
  .entry .l b{font-family:var(--display);font-size:15px;letter-spacing:.06em;
    text-transform:uppercase;font-weight:500;display:block}
  .entry .l i{font-family:var(--mono);font-size:11px;color:var(--dim);font-style:normal}
  .entry .l p{margin:6px 0 0;font-size:13px;color:var(--muted)}
  .entry .r{text-align:right;flex-shrink:0}
  .entry .r .pct{font-family:var(--mono);font-size:13px;color:var(--moss)}
  .entry .r .pn{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px}
  .entry .r .pn.hi{color:var(--ochre)}

  /* ---------- guide ---------- */
  details{border-bottom:1px solid var(--line)}
  details summary{
    cursor:pointer;padding:13px 0;font-family:var(--display);font-size:14px;
    letter-spacing:.1em;text-transform:uppercase;font-weight:400;list-style:none;
    display:flex;justify-content:space-between;align-items:center;
  }
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"+";font-family:var(--mono);color:var(--orange);font-size:16px}
  details[open] summary::after{content:"–"}
  details .body{padding:0 0 16px;font-size:13.5px;line-height:1.55;color:var(--text)}
  details .body p{margin:0 0 9px}
  details .body ul{margin:0 0 9px;padding-left:18px}
  details .body li{margin-bottom:5px}
  details .body h5{font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--orange);margin:14px 0 6px;font-weight:500}
  table{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 10px}
  th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);text-align:left;padding:5px 8px 5px 0;border-bottom:1px solid var(--line);
    font-weight:400}
  td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td:first-child{font-family:var(--mono);color:var(--muted);white-space:nowrap}
  tr.now td{color:var(--orange)}
  tr.now td:first-child{color:var(--orange)}

  .foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:12px}
  .foot span{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.1em}
  .foot button{background:none;border:1px solid var(--line);color:var(--dim);
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:7px 11px;border-radius:2px;cursor:pointer}
  .foot button:hover{border-color:var(--red);color:var(--red)}

  .loading{padding:60px 0;text-align:center;font-family:var(--mono);font-size:11px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:480px){
    h1{font-size:24px}
    .wordmark{font-size:19px;letter-spacing:.09em}
    .sets{max-width:none}
    .setrow{grid-template-columns:18px 1fr 1fr 32px;gap:5px}
    .prev{max-width:none}
    .tick{width:24px;height:24px}
  }
</style>

<div id="app"><div class="loading">Apertura scheda…</div></div>

<script>
(function(){
"use strict";

/* ============ PROGRAMMA ============ */

function squatFor(w){
  if(w<=2) return {n:"Goblet squat profondo",p:"3×8–10 · eccentrica 3\"",r:"2'",
    h:"Calibrazione: RIR 4–5. Deve sembrarti troppo facile — è il punto dove a giugno è andata storta."};
  if(w===3) return {n:"Squat bilanciere",p:"4×6–8 · profondità parziale",r:"2–3'",
    h:"Riparti dal 50–60% del carico di giugno. Non da quello che senti di poter fare."};
  if(w===4) return {n:"Squat bilanciere",p:"4×6–8 · +2,5 kg",r:"2–3'",
    h:"Aumenti solo il carico. La profondità resta quella della settimana scorsa."};
  if(w===5) return {n:"Squat bilanciere",p:"4×6–8 · +3–4 cm di profondità",r:"2–3'",
    h:"Aumenti solo la profondità. Carico invariato."};
  if(w===6) return {n:"Squat bilanciere",p:"4×6–8 · +2,5 kg",r:"2–3'",h:"Solo carico."};
  if(w===7) return {n:"Squat bilanciere",p:"4×6–8 · +3–4 cm di profondità",r:"2–3'",h:"Solo profondità."};
  if(w===8) return {n:"Squat bilanciere",p:"4×6–8 · +2,5 kg",r:"2–3'",h:"Solo carico."};
  return {n:"Squat bilanciere",p:"4×6–8 · profondità piena",r:"2–3'",
    h:"Progressione normale: +2,5 kg quando chiudi 8 rip su tutte le serie."};
}
function copenFor(w){
  if(w<=2) return {p:"3×15\"/lato · leva corta",h:"Appoggio sul ginocchio, rialzo 30–40 cm. Metti la gamba con le mani, non sollevarla attivamente."};
  if(w<=4) return {p:"3×30\"/lato · leva corta",h:"Appoggio sul ginocchio. Se l'ingresso dà fastidio all'anca, abbassa il rialzo."};
  if(w<=6) return {p:"3×15\"/lato · leva lunga",h:"Appoggio sulla caviglia. Non saltare lo step: è la progressione di Harøy."};
  return {p:"3×30\"/lato · leva lunga",h:"Appoggio sulla caviglia. Da qui aumenti il tempo, non la leva."};
}
function overFor(w){
  if(w<=2) return {p:"3×5/lato · frontale",h:"Barra a metà coscia, mano appoggiata al montante. Devi poterti fermare 2\" con la gamba sospesa."};
  if(w<=4) return {p:"3×5/lato · frontale + laterale",h:"Barra all'altezza dell'anca, ancora con appoggio. Il laterale aggiunge abduzione: è il pattern della sella."};
  if(w<=6) return {p:"3×5/lato · frontale + laterale",h:"Anca alta. Prova senza appoggio della mano."};
  return {p:"3×5/lato · frontale + laterale",h:"+1 foro a settimana, senza appoggio, pausa 2\" sopra la barra."};
}
function stepUpFor(w){
  if(w<=2) return {n:"Appoggio monopodalico su rialzo 20 cm",p:"3×30\"/lato",
    h:"Altra gamba a 90°. Avanzi quando il bacino resta stabile per 30\"."};
  if(w<=4) return {n:"Step-up 20 cm",p:"3×10/lato · salita 3\" / discesa 3\"",
    h:"Tutto il lavoro lo fa la gamba sopra: non spingere con quella a terra."};
  if(w<=6) return {n:"Step-up 30–40 cm",p:"3×8/lato",
    h:"Altezza pedana reale. In discesa tocca col tallone senza scaricare il peso."};
  return {n:"Step-up 40 cm con manubrio",p:"3×8/lato · 8–10 kg",
    h:"Manubrio nella mano opposta alla gamba che lavora: il medio gluteo deve stabilizzare."};
}

function upperWarm(){
  return [{n:"Face pull elastico + rotazione esterna",p:"2×15 · 2×12/lato",r:"30\"",warm:true,
    h:"Attivazione, non allenamento. Tienilo leggero: prepara extrarotatori e controllo scapolare."}];
}

function upperA(){
  return upperWarm().concat([
    {n:"Panca inclinata manubri 30°",p:"5×6–8",r:"2'",h:"Il tuo esercizio prioritario: capo clavicolare. Eccentrica controllata, ROM pieno."},
    {n:"Trazioni presa prona",p:"4×5–8",r:"2'",h:"Reps fisse, non max. Quando chiudi 8 su tutte le serie, aggiungi 2,5 kg di zavorra."},
    {n:"Shoulder press manubri",p:"3×8–10",r:"2'"},
    {n:"Rematore bilanciere",p:"3×8–10",r:"2'"},
    {n:"Croci manubri piane",p:"4×12–15",r:"75\"",h:"Gomiti a 15–20° fissi, 1\" di pausa in basso, fermati prima che i manubri si tocchino. Carico moderato."},
    {n:"Lateral raise",p:"5×12–15",r:"60\"",h:"Sulle ultime 2 serie: parziali in allungamento dopo il cedimento."},
    {n:"Close-grip bench press",p:"3×8–10",r:"90\"",h:"Presa a larghezza spalle. Sostituisce i dip: tricipiti pesanti senza stress sulla capsula anteriore."},
    {n:"Curl panca inclinata",p:"3×8–12",r:"60\""},
    {n:"Reverse curl EZ",p:"3×10–12",r:"45\""}
  ]);
}
function upperB(){
  return upperWarm().concat([
    {n:"Panca inclinata manubri 30°",p:"5×10–12",r:"90\""},
    {n:"Trazioni presa neutra",p:"4×5–8",r:"2'"},
    {n:"Shoulder press manubri",p:"3×10–12",r:"90\""},
    {n:"Chest-supported row panca 30°",p:"3×10–12",r:"90\""},
    {n:"Croci manubri piane",p:"4×12–15",r:"75\"",h:"Scapole retratte e depresse per tutta la serie: è ciò che protegge la spalla."},
    {n:"Lateral raise",p:"5×12–15",r:"60\""},
    {n:"Reverse fly panca 30°",p:"3×12–15",r:"60\""},
    {n:"Skull crusher EZ",p:"3×10–12",r:"75\""},

function setsOf(p){
  const m=String(p).match(/(\d+)\s*[×x]/);
  const n=m?parseInt(m[1],10):3;
  return Math.min(Math.max(n,1),6);
}

/* ============ STATO ============ */
const KEY="officina:v1";
let S={week:1,log:{},daily:{},hist:{},started:null};
let view="allen", day=null, saveTimer=null;

function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function logKey(id){return id+"|"+todayISO()}
function entry(id){
  const k=logKey(id);
  if(!S.log[k]) S.log[k]={sets:{},load:{},pain:{},flags:{},note:"",week:S.week};
  if(S.log[k].week===undefined) S.log[k].week=S.week;
  return S.log[k];
}
/* carichi per serie: [{kg,rep},…] — migra dai formati precedenti */
function normLoad(ld,n){
  let out=[];
  if(Array.isArray(ld)) out=ld.slice();
  else if(ld&&typeof ld==="object") out=[{kg:ld.kg||"",rep:ld.rep||""}];
  else if(typeof ld==="string"&&ld) out=[{kg:ld,rep:""}];
  while(out.length<n) out.push({kg:"",rep:""});
  for(let i=0;i<out.length;i++) if(!out[i]||typeof out[i]!=="object") out[i]={kg:"",rep:""};
  return out;
}
function loadSummary(ld){
  return ld.filter(function(s){return (s.kg||"").trim()||(s.rep||"").trim()})
    .map(function(s){
      const k=(s.kg||"").trim(), r=(s.rep||"").trim();
      return k&&r ? (k+"×"+r) : (k?k+" kg":r+" rip");
    }).join(" · ");
}

/* storico carichi per nome esercizio — sopravvive ai cambi di scheda */
function pushHist(name,val){
  if(!S.hist) S.hist={};
  const h=S.hist[name]||(S.hist[name]=[]);
  const d=todayISO();
  const last=h[h.length-1];
  if(last&&last.d===d){ last.v=val; last.w=S.week; }
  else h.push({d:d,w:S.week,v:val});
  if(!val&&last&&last.d===d) h.pop();
  if(h.length>20) h.shift();
  if(!h.length) delete S.hist[name];
}
function lastHist(name){
  const h=(S.hist||{})[name];
  if(!h||!h.length) return null;
  const d=todayISO();
  for(let i=h.length-1;i>=0;i--) if(h[i].d!==d&&h[i].v) return h[i];
  return null;
}

async function load(){
  let host=null, local=null;
  try{ const r=await window.storage.get(KEY); if(r&&r.value) host=JSON.parse(r.value); }
  catch(e){ hostOK=false; }
  try{ const b=backupRead(); if(b) local=JSON.parse(b); }catch(e){}
  /* uso la copia con più dati registrati: evita di perdere una seduta */
  const score=function(o){ return o?(Object.keys(o.log||{}).length*100+Object.keys(o.hist||{}).length):-1 };
  const best=score(local)>score(host)?local:host;
  if(best) S=Object.assign(S,best);
  if(!S.started) S.started=todayISO();
  if(!S.hist) S.hist={};
}
let dirty=false, saving=false, lastSaved=null, hostOK=true;

/* riserva locale: serve quando l'app è aperta fuori dall'app Claude (es. scorciatoia in home) */
function backupWrite(str){
  try{ if(window.localStorage) window.localStorage.setItem(KEY,str); }catch(e){}
}
function backupRead(){
  try{ return window.localStorage ? window.localStorage.getItem(KEY) : null; }catch(e){ return null; }
}

function markSaved(ok){
  lastSaved=ok?new Date():lastSaved;
  const el=document.getElementById("savestate");
  if(!el) return;
  if(ok){
    el.textContent=(hostOK?"Salvato ":"Salvato in locale ")+new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
    el.style.color="var(--dim)";
  }else{
    el.textContent="Salvataggio non riuscito";
    el.style.color="var(--red)";
  }
}
async function flush(){
  if(saving||!dirty) return;
  saving=true;
  const snapshot=JSON.stringify(S);
  backupWrite(snapshot);           /* scrittura immediata e sincrona */
  let ok=true;
  try{
    if(window.storage&&window.storage.set) await window.storage.set(KEY,snapshot);
    else hostOK=false;
  }catch(e){ hostOK=false; }
  dirty=false; markSaved(ok);
  saving=false;
  if(dirty) flush();
}
function save(){
  dirty=true;
  backupWrite(JSON.stringify(S));  /* mai perdere niente, nemmeno con un refresh immediato */
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,120);
}
/* scrittura forzata quando l'app passa in background o la pagina si ricarica */
document.addEventListener("visibilitychange",function(){ if(document.hidden){clearTimeout(saveTimer);flush();} });
window.addEventListener("pagehide",function(){clearTimeout(saveTimer);flush();});
window.addEventListener("blur",function(){clearTimeout(saveTimer);flush();});
setInterval(function(){ if(dirty) flush(); },4000);

  return h;
}

function viewDaily(){
  const k="d|"+todayISO();
  const d=S.daily[k]||{};
  let done=0;DAILY.forEach(function(x,i){if(d[i])done++});
  const pct=Math.round(done/DAILY.length*100);
  let h='<div class="sesshead"><div><h1>Ogni giorno</h1><div class="tag">9 minuti · il binario moto</div></div>'+
    '<div class="gauge"><b class="'+(pct===100?"full":"")+'">'+pct+'%</b><i>'+done+'/'+DAILY.length+'</i></div></div>'+
    '<div class="bar"><i class="'+(pct===100?"full":"")+'" style="width:'+pct+'%"></i></div>';
  h+='<div class="block"><h4>Perché quotidiano</h4><p>Carico bassissimo e adattamento in gran parte neurale: '+
     'qui la frequenza rende più del volume concentrato. Step-over e step-up invece sono allenamento vero '+
     'e stanno nelle sedute lower.</p></div>';
  h+='<div class="rows">';
  DAILY.forEach(function(x,i){
    h+='<div class="row'+(d[i]?" done":"")+'"><div class="idx">'+String(i+1).padStart(2,"0")+'</div>'+
       '<div class="name"><b>'+esc(x.n)+'</b><div class="presc">'+esc(x.p)+'</div>'+
       (x.h?'<div class="hint">'+esc(x.h)+'</div>':'')+'</div><div class="rest"></div>'+
       '<div class="ctrl"><div class="ticks"><button class="tick" data-daily="'+i+'" aria-pressed="'+(!!d[i])+'" aria-label="Fatto"></button></div></div></div>';
  });
  h+='</div><div class="after"><b>Se hai solo 5 minuti</b>Ginocchio alto con elastico, 90/90 lift-off, couch stretch. Sono i tre che pesano di più.</div>';
  return h;
}

function viewProg(){
  const H=S.hist||{};
  const names=Object.keys(H).filter(function(n){return H[n].length});
  let h='<div class="sesshead"><div><h1>Progressione</h1>'+
    '<div class="tag">Storico carichi per esercizio</div></div></div>';
  if(!names.length) return h+'<div class="block calm"><h4>Ancora niente</h4>'+
    '<p>Scrivi il carico nel campo accanto a un esercizio e da lì in poi lo ritrovi qui, '+
    'settimana per settimana. Nella seduta ti compare anche il valore dell\'ultima volta, '+
    'da ricopiare con un tocco.</p></div>';
  h+='<div class="block"><h4>Come leggerlo</h4><p>Sui multiarticolari +2,5 kg ogni due settimane '+
     'è già veloce per il tuo caso. Se vedi tre settimane di fila con lo stesso valore su squat o RDL, '+
     'non è stallo: è il ritmo previsto.</p></div>';
  names.sort();
  names.forEach(function(n){
    const l=H[n].slice(-6);
    h+='<div class="track"><b>'+esc(n)+'</b><div class="spark">';
    l.forEach(function(r){h+='<i><u>s'+r.w+'</u>'+esc(r.v)+'</i>'});
    h+='</div></div>';
  });
  return h;
}

function viewDiary(){
  const keys=Object.keys(S.log).sort().reverse();
  let h='<div class="sesshead"><div><h1>Diario</h1><div class="tag">Ultime sedute registrate</div></div></div>';
  if(!keys.length) return h+'<div class="block calm"><h4>Ancora niente</h4>'+
    '<p>Le sedute che completi finiscono qui. Serve per accorgersi di una deriva prima che diventi un altro stop di due mesi.</p></div>';
  h+='<div class="rows">';
  keys.slice(0,60).forEach(function(k){
    const p=k.split("|"), D=DAYS.find(function(x){return x.id===p[0]});
    if(!D) return;
    const e=S.log[k], ex=D.get(e.week||S.week);
    let t=0,c=0;ex.forEach(function(x,i){const n=setsOf(x.p);t+=n;const a=e.sets[i]||[];for(let j=0;j<n;j++) if(a[j])c++;});
    if(!c&&e.pain.during===undefined&&!e.note) return;
    const fl=Object.keys(e.flags||{}).filter(function(f){return e.flags[f]});
    h+='<div class="entry"><div class="l"><b>'+D.title+'</b><i>'+p[1]+(e.closed?" · chiusa "+esc(e.closed):"")+'</i>'+
       (e.note?'<p>'+esc(e.note)+'</p>':'')+
       (fl.length?'<p style="color:var(--ochre)">'+fl.join(" · ")+'</p>':'')+'</div>'+
       '<div class="r"><div class="pct">'+(t?Math.round(c/t*100):0)+'%</div>'+
       (e.pain.during!==undefined?'<div class="pn'+(e.pain.during>3?" hi":"")+'">dolore '+e.pain.during+'/10</div>':'')+
       '</div></div>';
  });
  return h+'</div>';
}

/* aggiorna contatore e righe senza ricostruire la pagina */
function refreshGauge(){
  const D=DAYS.find(function(x){return x.id===day});
  if(!D) return;
  const ex=D.get(S.week), e=entry(D.id);
  let total=0,done=0;
  ex.forEach(function(x,i){
    const n=setsOf(x.p), a=e.sets[i]||[];
    let c=0; for(let j=0;j<n;j++) if(a[j]) c++;
    total+=n; done+=c;
    const row=document.querySelectorAll('.rows .row')[i];
    if(row) row.classList.toggle("done",c===n&&n>0);
  });
  const pct=total?Math.round(done/total*100):0;
  const g=document.querySelector('.gauge b'), gi=document.querySelector('.gauge i'),
        bar=document.querySelector('.bar i');
  if(g){g.textContent=pct+"%";g.classList.toggle("full",pct===100)}
  if(gi) gi.textContent=done+"/"+total+" serie";
  if(bar){bar.style.width=pct+"%";bar.classList.toggle("full",pct===100)}
  const cb=document.getElementById("closebtn");
  if(cb){cb.classList.toggle("ready",pct>0);cb.disabled=pct===0}
}

/* ============ EVENTI ============ */
function wire(){
  document.querySelectorAll('nav button').forEach(function(b){
    b.onclick=function(){view=b.dataset.v;render()};
  });
  document.querySelectorAll('.chip').forEach(function(b){
    b.onclick=function(){day=b.dataset.day;render()};
  });
  const wm=document.getElementById("wm"),wp=document.getElementById("wp");
  if(wm) wm.onclick=function(){if(S.week>1){S.week--;save();render()}};
  if(wp) wp.onclick=function(){S.week++;save();render()};

  document.querySelectorAll('.tick[data-ex]').forEach(function(b){
    b.onclick=function(){
      const D=DAYS.find(function(x){return x.id===day}),e=entry(D.id),
        i=+b.dataset.ex,j=+b.dataset.set;
      if(!e.sets[i]) e.sets[i]=[];
      e.sets[i][j]=!e.sets[i][j];
      save();
      b.setAttribute("aria-pressed",String(!!e.sets[i][j]));
      refreshGauge();
    };
  });
  document.querySelectorAll('.tick[data-daily]').forEach(function(b){
    b.onclick=function(){
      const k="d|"+todayISO();
      if(!S.daily[k]) S.daily[k]={};
      const i=+b.dataset.daily;
      S.daily[k][i]=!S.daily[k][i];
      save();render();
    };
  });
  document.querySelectorAll('input.load').forEach(function(inp){
    const commit=function(){
      const D=DAYS.find(function(x){return x.id===day}), e=entry(D.id),
            i=+inp.dataset.ex, j=+inp.dataset.set, n=setsOf(D.get(S.week)[i].p);
      const ld=normLoad(e.load[i],n);
      ld[j][inp.dataset.f]=inp.value;
      e.load[i]=ld;
      pushHist(inp.dataset.name, loadSummary(ld));
      save();
    };
    inp.oninput=commit;
    inp.onblur=commit;
  });
  document.querySelectorAll('.prev').forEach(function(b){
    b.onclick=function(){
      const D=DAYS.find(function(x){return x.id===day}), i=+b.dataset.ex, e=entry(D.id),
            n=setsOf(D.get(S.week)[i].p);
      const parts=String(b.dataset.v).split("·").map(function(s){return s.trim()}).filter(Boolean);
      const ld=normLoad(null,n);
      parts.forEach(function(p,k){
        if(k>=n) return;
        const m=p.match(/^([\d.,]+)\s*(?:×\s*(\d+))?/);
        if(m){ ld[k].kg=m[1]||""; ld[k].rep=m[2]||""; }
      });
      /* se l'ultima volta aveva meno serie, replica l'ultima sulle rimanenti */
      const lastFilled=parts.length?ld[Math.min(parts.length,n)-1]:null;
      if(lastFilled) for(let k=parts.length;k<n;k++){ ld[k].kg=lastFilled.kg; ld[k].rep=lastFilled.rep; }
      e.load[i]=ld;
      document.querySelectorAll('input.load[data-ex="'+i+'"]').forEach(function(inp){
        inp.value=ld[+inp.dataset.set][inp.dataset.f]||"";
      });
      pushHist(b.dataset.name, loadSummary(ld));
      save();
    };
  });
  document.querySelectorAll('.scale').forEach(function(sc){
    sc.querySelectorAll('button').forEach(function(b){
      b.onclick=function(){
        const D=DAYS.find(function(x){return x.id===day}),e=entry(D.id),k=sc.dataset.k,v=+b.dataset.v;
        e.pain[k]=(e.pain[k]===v)?undefined:v;save();render();
      };
    });
  });
  document.querySelectorAll('.flag').forEach(function(b){
    b.onclick=function(){
      const D=DAYS.find(function(x){return x.id===day}),e=entry(D.id),f=b.dataset.f;
      e.flags[f]=!e.flags[f];save();render();
    };
  });
  const ta=document.querySelector('textarea.note');
  if(ta) ta.oninput=function(){
    const D=DAYS.find(function(x){return x.id===day});
    entry(D.id).note=ta.value;save();
  };
  const cb=document.getElementById("closebtn");
  if(cb) cb.onclick=async function(){
    const D=DAYS.find(function(x){return x.id===day}),e=entry(D.id);
    e.closed=e.closed?null:new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
    if(!e.closed) delete e.closed;
    dirty=true;clearTimeout(saveTimer);
    await flush();
    render();
  };
  /* --- backup --- */
  const expbox=document.getElementById("expbox");
  if(expbox) expbox.value=JSON.stringify(S);
  const stamp=function(){
    const d=new Date();
    return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  };
  const ef=document.getElementById("expfile");
  if(ef) ef.onclick=function(){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="workout-plan-"+stamp()+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},1000);
  };
  const ec=document.getElementById("expcopy");
  if(ec) ec.onclick=async function(){
    const txt=JSON.stringify(S);
    try{ await navigator.clipboard.writeText(txt); ec.textContent="Copiato ✓"; }
    catch(err){
      if(expbox){ expbox.focus(); expbox.select(); }
      ec.textContent="Seleziona e copia";
    }
    setTimeout(function(){ec.textContent="Copia negli appunti"},2200);
  };
  const impmsg=document.getElementById("impmsg");
  const applyImport=function(txt){
    let data;
    try{ data=JSON.parse(txt); }
    catch(err){ if(impmsg){impmsg.className="impmsg err";impmsg.textContent="File non leggibile."} return; }
    if(!data||typeof data!=="object"||(!data.log&&!data.hist&&data.week===undefined)){
      if(impmsg){impmsg.className="impmsg err";impmsg.textContent="Non sembra un backup di questa app."}
      return;
    }
    const n=Object.keys(data.log||{}).length;
    if(!confirm("Sostituisco i dati attuali con il backup ("+n+" sedute). Non si può annullare.")) return;
    S={week:data.week||1,log:data.log||{},daily:data.daily||{},hist:data.hist||{},started:data.started||todayISO()};
    dirty=true; clearTimeout(saveTimer);
    flush().then(function(){
      if(impmsg){impmsg.className="impmsg ok";impmsg.textContent="Caricato: "+n+" sedute."}
      setTimeout(render,900);
    });
  };
  const impf=document.getElementById("impfile");
  if(impf) impf.onchange=function(){
    const f=impf.files&&impf.files[0];
    if(!f) return;
    const rd=new FileReader();
    rd.onload=function(){applyImport(String(rd.result))};
    rd.onerror=function(){ if(impmsg){impmsg.className="impmsg err";impmsg.textContent="Lettura del file non riuscita."} };
    rd.readAsText(f);
  };
  const impgo=document.getElementById("impgo");
  if(impgo) impgo.onclick=function(){
    const box=document.getElementById("impbox");
    if(!box||!box.value.trim()){
      if(impmsg){impmsg.className="impmsg err";impmsg.textContent="Incolla prima il backup, o scegli un file."}
      return;
    }
    applyImport(box.value.trim());
  };

  const rs=document.getElementById("reset");
  if(rs) rs.onclick=async function(){
    if(!confirm("Azzera settimana, serie, carichi e diario. Non si può annullare.")) return;
    S={week:1,log:{},daily:{},hist:{},started:todayISO()};
    backupWrite(JSON.stringify(S));
    try{await window.storage.set(KEY,JSON.stringify(S));}catch(e){}
    render();
  };
}

load().then(render).catch(function(e){console.error(e);render()});
})();
</script>
